<svg xmlns="http://www.w3.org/2000/svg" width="402" height="366" viewBox="0 0 402 366" role="img" aria-label="High School Assessment Architecture"><title>High School Assessment Architecture</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#CC0000"/></marker></defs><rect width="402" height="366" fill="#101010"/><path d="M0,6 H402" stroke="#CC0000" stroke-width="7"/><text x="50" y="55" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="27" font-weight="700">High School Assessment Architecture</text><rect x="50" y="140" width="302" height="176" rx="13" fill="#181818" stroke="#D40000" stroke-width="3"/><text x="201" y="179" font-family="Arial,sans-serif" fill="#FFFFFF" text-anchor="middle" font-size="16" font-weight="600"><tspan x="201" dy="0">High School Course → Course</tspan><tspan x="201" dy="18">Curriculum → Objective</tspan><tspan x="201" dy="18">Assessment (OA) + Performance</tspan><tspan x="201" dy="18">Assessment (PA) → Both</tspan><tspan x="201" dy="18">Proctored → Course Requirements</tspan><tspan x="201" dy="18">Complete → Credit Earned → Next</tspan><tspan x="201" dy="18">Course / Semester.</tspan></text></svg>
