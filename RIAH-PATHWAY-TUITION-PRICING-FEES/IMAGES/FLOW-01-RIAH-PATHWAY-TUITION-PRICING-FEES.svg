<svg xmlns="http://www.w3.org/2000/svg" width="402" height="976" viewBox="0 0 402 976" role="img" aria-label="VII. 🔄 Integrated Education and Experiential Adjustment"><title>VII. 🔄 Integrated Education and Experiential Adjustment</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#CC0000"/></marker></defs><rect width="402" height="976" fill="#101010"/><path d="M0,6 H402" stroke="#CC0000" stroke-width="7"/><text x="50" y="55" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="27" font-weight="700">VII. 🔄 Integrated Education and Experiential Adjustment</text><path d="M201,266 L201,313 L201,313 L201,355" fill="none" stroke="#CC0000" stroke-width="2.5" marker-end="url(#arrow)" opacity=".95"/><path d="M201,486 L201,533 L201,533 L201,575" fill="none" stroke="#CC0000" stroke-width="2.5" marker-end="url(#arrow)" opacity=".95"/><path d="M201,706 L201,753 L201,753 L201,795" fill="none" stroke="#CC0000" stroke-width="2.5" marker-end="url(#arrow)" opacity=".95"/><rect x="50" y="140" width="302" height="126" rx="13" fill="#181818" stroke="#D40000" stroke-width="3"/><text x="201" y="190" font-family="Arial,sans-serif" fill="#FFFFFF" text-anchor="middle" font-size="16" font-weight="600"><tspan x="201" dy="0">Combined Standard = Education</tspan><tspan x="201" dy="18">Standard + Experiential</tspan><tspan x="201" dy="18">Standard</tspan></text><rect x="50" y="360" width="302" height="126" rx="13" fill="#181818" stroke="#D40000" stroke-width="3"/><text x="201" y="419" font-family="Arial,sans-serif" fill="#FFFFFF" text-anchor="middle" font-size="16" font-weight="600"><tspan x="201" dy="0">Integrated Adjustment =</tspan><tspan x="201" dy="18">Combined Standard × 5%</tspan></text><rect x="50" y="580" width="302" height="126" rx="13" fill="#181818" stroke="#D40000" stroke-width="3"/><text x="201" y="630" font-family="Arial,sans-serif" fill="#FFFFFF" text-anchor="middle" font-size="16" font-weight="600"><tspan x="201" dy="0">Integrated Standard = Combined</tspan><tspan x="201" dy="18">Standard − Integrated</tspan><tspan x="201" dy="18">Adjustment</tspan></text><rect x="50" y="800" width="302" height="126" rx="13" fill="#181818" stroke="#D40000" stroke-width="3"/><text x="201" y="850" font-family="Arial,sans-serif" fill="#FFFFFF" text-anchor="middle" font-size="16" font-weight="600"><tspan x="201" dy="0">The applicable Pricing Stage is</tspan><tspan x="201" dy="18">then applied to the Integrated</tspan><tspan x="201" dy="18">Standard.</tspan></text></svg>
